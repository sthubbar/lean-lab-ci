# TACTIC SWEEP, a free proving lane with no AI, on the public mirror sthubbar/lean-lab-ci where minutes are free.
# Written by lrefresh 20261112 with Steve live, 11:00 PM PT Wed 11-11. Owner: lean-merge. Source of truth is scripts/ci/tactic-sweep.yml
# in the Lean Lab folder; ci_mirror.py copies it here with every mirror of main, so edit it there, never here.
# Every 2 hours, 8 shards by stable file hash, each runs scripts/ci/sweep.py on its files and commits
# results/<run_id>-<shard>.json to branch sweep-results; the summary job writes results/<run_id>-summary.json.
# sweep_import.py on the PC turns closed declarations into sweep/ branches that the gate judges like any other.
# PRIORITY: the gate runs first. A shard that sees any lean-gate run queued or in progress exits early with success.
# Test by hand: POST actions/workflows/tactic-sweep.yml/dispatches {"ref":"main","inputs":{"only":"0","force":"true"}}
name: tactic-sweep
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this shard number, 0 to 7; empty runs all 8'
        required: false
        default: ''
      force:
        description: 'true skips the gate priority check, for a test only'
        required: false
        default: 'false'
permissions:
  contents: write
  actions: read
concurrency:
  group: tactic-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(inputs.only != '' && format('[{0}]', inputs.only) || '[0, 1, 2, 3, 4, 5, 6, 7]') }}
    # only is compared to the empty string alone: GitHub coerces both null and '0' to the number 0, so a null test ran all 8 shards for only 0
    steps:
      - uses: actions/checkout@v4
      - name: Gate priority, the gate runs first
        id: prio
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "SWEEP force, priority check skipped"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=0
          for s in queued in_progress; do
            c=$(curl -sS --retry 2 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/lean-gate.yml/runs?status=$s&per_page=1" | python3 -c "import json,sys; print(int(json.load(sys.stdin)['total_count']))") || c=1
            n=$((n + c))
          done
          if [ "$n" -gt 0 ]; then
            echo "SWEEP SKIP shard ${{ matrix.shard }}: $n lean-gate runs queued or in progress, the gate runs first" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Free disk space
        if: steps.prio.outputs.skip != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: Restore compiled lab modules
        if: steps.prio.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: LeanLab/.lake/build
          key: lab-${{ hashFiles('LeanLab/lean-toolchain', 'LeanLab/lake-manifest.json') }}-none
          restore-keys: |
            lab-${{ hashFiles('LeanLab/lean-toolchain', 'LeanLab/lake-manifest.json') }}-
      - name: Cache the Lean toolchain
        if: steps.prio.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('LeanLab/lean-toolchain') }}
      - name: Lean and Mathlib cache
        if: steps.prio.outputs.skip != 'true'
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          for i in 1 2 3 4 5; do
            if ! command -v elan >/dev/null 2>&1; then
              curl -sSfL --retry 3 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz && tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" && "$RUNNER_TEMP/elan-init" -y --default-toolchain none >/dev/null || true
            fi
            bash scripts/agent_setup.sh
            if (cd LeanLab && lake --version) >/dev/null 2>&1; then echo "toolchain ok on try $i"; break; fi
            echo "toolchain missing after try $i"; sleep $((i * 40))
          done
          (cd LeanLab && lake --version) >/dev/null 2>&1 || { echo "CI: INFRA toolchain download failed"; exit 1; }
      - name: Sweep this shard
        if: steps.prio.outputs.skip != 'true'
        env:
          SWEEP_DEADLINE: '12000'
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/ci/sweep.py shard ${{ matrix.shard }} 8 "$RUNNER_TEMP/sweep" "${{ github.run_id }}" | tee -a "$RUNNER_TEMP/sweep.log"
          grep "^SWEEP RESULT\|^SWEEP CLOSED" "$RUNNER_TEMP/sweep.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit the result to branch sweep-results
        if: always() && steps.prio.outputs.skip != 'true'
        run: |
          f="$RUNNER_TEMP/sweep/${{ github.run_id }}-${{ matrix.shard }}.json"
          if [ -f "$f" ]; then python3 scripts/ci/sweep.py push "$f" "results/${{ github.run_id }}-${{ matrix.shard }}.json"; else echo "no result file"; fi
      - name: Keep the shard report
        if: always() && steps.prio.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/sweep/*.json
            ${{ runner.temp }}/sweep.log
          if-no-files-found: ignore
          retention-days: 14
  summary:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run summary
        run: python3 scripts/ci/sweep.py summary "${{ github.run_id }}" "$RUNNER_TEMP/sum" | tee -a "$GITHUB_STEP_SUMMARY"
