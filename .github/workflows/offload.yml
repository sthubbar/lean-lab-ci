# PC OFFLOAD on the public mirror sthubbar/lean-lab-ci, free minutes. Written by lrefresh 20261112 with Steve live,
# 11:00 PM PT Wed 11-11. Owner: lean-merge. Source of truth is scripts/ci/offload.yml in the Lean Lab folder; ci_mirror.py copies it here.
# Heavy work that would tie up the PC runs here instead, by hand dispatch only:
#   kind lake-build   target a module or lake target, for example LeanLab.Akeno2026.Statements
#   kind comparator   target a comparator config path relative to LeanLab/, runs lake exe comparator <target>
#   kind script       target a python script path in the mirror, for example scripts/mountain.py, args optional
# The mirror holds only Lean code and scripts/*.sh and *.py, never notes or ledgers. See PLAYBOOK.md FREE CI LANES.
name: offload
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'lake-build, comparator or script'
        required: true
        type: choice
        options: [lake-build, comparator, script]
      target:
        description: 'module, comparator config path, or script path'
        required: true
      args:
        description: 'extra arguments for kind script'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  offload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - name: Restore compiled lab modules
        uses: actions/cache/restore@v4
        with:
          path: LeanLab/.lake/build
          key: lab-${{ hashFiles('LeanLab/lean-toolchain', 'LeanLab/lake-manifest.json') }}-none
          restore-keys: |
            lab-${{ hashFiles('LeanLab/lean-toolchain', 'LeanLab/lake-manifest.json') }}-
      - name: Cache the Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('LeanLab/lean-toolchain') }}
      - name: Lean and Mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          for i in 1 2 3 4 5; do
            if ! command -v elan >/dev/null 2>&1; then
              curl -sSfL --retry 3 -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz && tar xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP" && "$RUNNER_TEMP/elan-init" -y --default-toolchain none >/dev/null || true
            fi
            bash scripts/agent_setup.sh
            if (cd LeanLab && lake --version) >/dev/null 2>&1; then echo "toolchain ok on try $i"; break; fi
            echo "toolchain missing after try $i"; sleep $((i * 40))
          done
          (cd LeanLab && lake --version) >/dev/null 2>&1 || { echo "CI: INFRA toolchain download failed"; exit 1; }
      - name: Run the offload
        env:
          KIND: ${{ inputs.kind }}
          TARGET: ${{ inputs.target }}
          ARGS: ${{ inputs.args }}
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          OUT="$RUNNER_TEMP/offload"; mkdir -p "$OUT"
          case "$TARGET" in *[!A-Za-z0-9_./-]*|*..*) echo "OFFLOAD refused target $TARGET"; exit 1;; esac
          case "$ARGS" in *[\;\&\|\`\$\<\>]*) echo "OFFLOAD refused args"; exit 1;; esac
          echo "OFFLOAD $KIND $TARGET $ARGS" | tee -a "$GITHUB_STEP_SUMMARY"
          set -o pipefail; rc=0
          case "$KIND" in
            lake-build) (cd LeanLab && lake build "$TARGET") 2>&1 | grep -v '^✔' | tee "$OUT/log.txt";;
            comparator) (cd LeanLab && lake exe comparator "$TARGET") 2>&1 | tee "$OUT/log.txt";;
            script) python3 "$TARGET" $ARGS 2>&1 | tee "$OUT/log.txt";;
            *) echo "OFFLOAD unknown kind $KIND"; exit 1;;
          esac || rc=$?
          echo "OFFLOAD RESULT rc $rc" | tee -a "$GITHUB_STEP_SUMMARY"; tail -20 "$OUT/log.txt" >> "$GITHUB_STEP_SUMMARY"; exit $rc
        shell: bash
      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offload-output
          path: ${{ runner.temp }}/offload/
          if-no-files-found: ignore
          retention-days: 14
